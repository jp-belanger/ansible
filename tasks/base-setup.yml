- name: Install system packages
  become: true
  pacman:
    name:
      - base
      - base-devel
      - git
      - linux
      - btrfs-progs
      - efibootmgr
      - sof-firmware
  tags:
    - install
    - base

- name: Install Networking Stack (NetworkManager + Tailscale)
  become: true
  pacman:
    name:
      - networkmanager
      - tailscale
    state: present
  tags:
    - install
    - base

- name: Configure NetworkManager to use systemd-resolved
  become: true
  ansible.builtin.blockinfile:
    path: /etc/NetworkManager/conf.d/dns.conf
    create: yes
    block: |
      [main]
      dns=systemd-resolved
  tags:
    - install
    - base

- name: Enable systemd-resolved service
  become: true
  systemd:
    name: systemd-resolved
    enabled: yes
    state: started
  tags:
    - install
    - base

- name: Symlink /etc/resolv.conf to systemd-resolved stub
  become: true
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: yes
  tags:
    - install
    - base

- name: Enable and Start NetworkManager and Tailscale
  become: true
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - NetworkManager
    - tailscaled
  tags:
    - install
    - base

- name: Install sway & wayland essentials
  become: true
  pacman:
    name:
      - sway
      - swaybg
      - swayidle
      - xorg-xwayland
      - waybar
      - rofi
      - mako
      - kanshi
      - xdg-desktop-portal-wlr
      - xdg-desktop-portal-gtk
      - alacritty
      - polkit
      - wl-clipboard
      - bluez
      - bluez-utils
      - nwg-look
      - gnome-themes-extra
      - xdg-utils
      - power-profiles-daemon
  tags:
    - install
    - base

- name: Install audio
  become: true
  pacman:
    name:
      - pipewire
      - gst-plugin-pipewire
      - wireplumber
      - alsa-utils
      - libpulse
      - pipewire-alsa
      - pipewire-jack
      - pipewire-pulse
      - pavucontrol
    state: present
  tags:
    - install
    - base

- name: Install greeter
  become: true
  pacman:
    name: ly
    update_cache: yes
    state: present
  tags:
    - install
    - base

- name: Enable greeter service
  become: true
  systemd:
    name: ly@tty2.service
    enabled: yes
    daemon_reload: yes
  tags:
    - install
    - base

- name: Install system applications
  become: true
  pacman:
    name:
      - thunar
      - gvfs
      - thunar-archive-plugin
    state: present
  tags:
    - install
    - base

- name: Install fonts
  become: true
  pacman:
    name:
      - ttf-jetbrains-mono-nerd 
      - inter-font
      - noto-fonts-emoji
      - otf-font-awesome
    state: present
  tags:
    - install
    - base


- name: Enable power profile service
  become: true
  systemd:
    name: power-profiles-daemon
    enabled: yes
    state: started
  tags:
    - install
    - base


- name: Create the `aur_builder` user
  become: yes
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel
  tags:
    - install
    - base

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
    create: yes
    mode: 0644
    validate: 'visudo -cf %s'
  tags:
    - install
    - base


- name: Install utilities
  kewlfft.aur.aur:
    use: yay
    name:
      - rofi-bluetooth-git
      - networkmanager-dmenu-git
      - swaylock-effects
      - brave-bin
      - wdisplays
      - rofi-power-menu
    state: present
  become: true
  become_user: aur_builder
  tags:
    - install
    - base

- name: Remove sudo privileges for `aur_builder` user
  become: yes
  ansible.builtin.file:
    path: /etc/sudoers.d/11-install-aur_builder
    state: absent
  tags:
    - install
    - base

- name: Remove the `aur_builder` user
  become: yes
  ansible.builtin.user:
    name: aur_builder
    state: absent
    remove: yes
  tags:
    - install
    - base
