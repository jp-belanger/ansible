---
- name: Install nested TWS runtime packages
  become: true
  ansible.builtin.pacman:
    name:
      - bash
      - coreutils
      - gawk
      - openbox
      - stow
      - util-linux
      - wmctrl
      - xorg-server-xephyr
      - xorg-xauth
      - xorg-xdpyinfo
      - xorg-xprop
      - xorg-xwayland
    state: present
  tags:
    - never
    - ib-tws

- name: Install Interactive Brokers TWS from the AUR
  block:
    - name: Create the temporary AUR builder
      become: true
      ansible.builtin.user:
        name: aur_builder
        create_home: true
        group: wheel
      changed_when: false

    - name: Allow the AUR builder to install packages
      become: true
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/11-install-aur_builder
        line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
        create: true
        mode: "0644"
        validate: "visudo -cf %s"
      changed_when: false

    - name: Install the latest Interactive Brokers TWS package
      become: true
      become_user: aur_builder
      kewlfft.aur.aur:
        use: yay
        name:
          - ib-tws
        state: latest
  always:
    - name: Remove the AUR builder's sudo permission
      become: true
      ansible.builtin.file:
        path: /etc/sudoers.d/11-install-aur_builder
        state: absent
      changed_when: false

    - name: Remove the temporary AUR builder
      become: true
      ansible.builtin.user:
        name: aur_builder
        state: absent
        remove: true
      changed_when: false
  tags:
    - never
    - ib-tws

- name: Link nested TWS dotfiles
  ansible.builtin.command:
    argv:
      - stow
      - --no-folding
      - -R
      - -t
      - "{{ user_home }}"
      - -d
      - "{{ user_home }}/.dotfiles"
      - ib-tws
  changed_when: false
  tags:
    - never
    - ib-tws
